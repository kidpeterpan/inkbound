name: Release

# Obsidian's plugin installer resolves a release by matching the git tag
# exactly against manifest.json's "version" field, with NO "v" prefix (e.g.
# tag "1.0.0", not "v1.0.0"). A "v"-prefixed tag would never match and the
# plugin would never be picked up by Obsidian's update mechanism, so the tag
# pattern here is deliberately a bare numeric glob.
on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Fail fast, before spending CI time on the gate below, if whoever
      # pushed the tag mistyped it relative to manifest.json.
      - name: Verify tag matches manifest.json version
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          manifest_version=$(jq -r .version manifest.json)
          if [ "$TAG_VERSION" != "$manifest_version" ]; then
            echo "::error::tag '$TAG_VERSION' does not match manifest.json version '$manifest_version'"
            exit 1
          fi
          echo "tag matches manifest.json version: $manifest_version"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Full gate — a release must never ship a build that fails it.
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc --noEmit
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run version:check

      # Uses the preinstalled gh CLI rather than a third-party action: one less
      # dependency, and a permissions failure surfaces as a readable HTTP error
      # instead of an opaque action failure. Idempotent — re-running the same
      # tag re-uploads the assets instead of erroring on an existing release.
      #
      # Requires the repository's Settings -> Actions -> General -> "Workflow
      # permissions" to be "Read and write permissions". With the read-only
      # default, creating a release fails with
      # "Resource not accessible by integration" even though the job declares
      # contents: write above.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for f in main.js manifest.json styles.css; do
            test -f "$f" || { echo "::error::missing release asset $f"; exit 1; }
          done
          notes="Install manually: download \`main.js\`, \`manifest.json\` and \`styles.css\` into \`<vault>/.obsidian/plugins/inkbound/\`, then enable **Inkbound** in Settings → Community plugins."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists — re-uploading assets"
            gh release upload "$TAG" main.js manifest.json styles.css --clobber
          else
            gh release create "$TAG" \
              --title "Inkbound $TAG" \
              --notes "$notes" \
              main.js manifest.json styles.css
          fi
          gh release view "$TAG" --json tagName,assets \
            --jq '"published \(.tagName) with assets: \(.assets | map(.name) | join(", "))"'
