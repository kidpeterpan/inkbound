name: Release

# Obsidian's plugin installer resolves a release by matching the git tag
# exactly against manifest.json's "version" field, with NO "v" prefix (e.g.
# tag "1.0.0", not "v1.0.0"). A "v"-prefixed tag would never match and the
# plugin would never be picked up by Obsidian's update mechanism, so the tag
# pattern here is deliberately a bare numeric glob.
on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Both are required to publish artifact attestations, which let users
      # cryptographically verify that main.js was built from this repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      # Fail fast, before spending CI time on the gate below, if whoever
      # pushed the tag mistyped it relative to manifest.json.
      - name: Verify tag matches manifest.json version
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          manifest_version=$(jq -r .version manifest.json)
          if [ "$TAG_VERSION" != "$manifest_version" ]; then
            echo "::error::tag '$TAG_VERSION' does not match manifest.json version '$manifest_version'"
            exit 1
          fi
          echo "tag matches manifest.json version: $manifest_version"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Full gate — a release must never ship a build that fails it.
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc --noEmit
      - run: npm run test:coverage
      - run: npm run build
      # Must follow build — inspects the built bundle and loads it in a
      # mobile-like runtime. A release that fails this would install on a phone
      # and then fail to load at all, so it gates a release as firmly as CI.
      - run: npm run check-mobile-safe
      - run: npm run version:check

      # Publishes a signed statement that these exact bytes were built by this
      # workflow from this repository, so a user can verify the provenance of a
      # downloaded release asset with `gh attestation verify main.js -R
      # kidpeterpan/inkbound`. Requires the id-token and attestations
      # permissions declared above.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json

      # Uses the preinstalled gh CLI rather than a third-party action: one less
      # dependency, and a permissions failure surfaces as a readable HTTP error
      # instead of an opaque action failure. Idempotent — re-running the same
      # tag re-uploads the assets instead of erroring on an existing release.
      #
      # Requires the repository's Settings -> Actions -> General -> "Workflow
      # permissions" to be "Read and write permissions". With the read-only
      # default, creating a release fails with
      # "Resource not accessible by integration" even though the job declares
      # contents: write above.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # main.js and manifest.json are mandatory. styles.css is optional and
          # is only shipped when it has content — GitHub rejects zero-byte
          # release assets, which silently fails the whole release step.
          assets=(main.js manifest.json)
          for f in "${assets[@]}"; do
            test -s "$f" || { echo "::error::required release asset $f is missing or empty"; exit 1; }
          done
          if [ -s styles.css ]; then
            assets+=(styles.css)
          else
            echo "styles.css is empty — omitting it (Obsidian only needs it when the plugin ships styles)"
          fi
          echo "assets: ${assets[*]}"

          # Surface who we are and what we may do, so a permissions failure is
          # obvious in the log instead of an opaque exit 1.
          gh api "repos/$GITHUB_REPOSITORY" --jq '"repo visibility: \(.visibility), permissions: \(.permissions)"' || true

          # Release notes come from the matching CHANGELOG.md section, so the
          # description lives in the repo under review rather than in a tag
          # message that is easy to lose. Missing section => fail, rather than
          # publish a release with no description.
          notes_file="$(mktemp)"
          awk -v v="$TAG" '
            $0 == "## " v { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > "$notes_file"
          if [ ! -s "$notes_file" ]; then
            echo "::error::CHANGELOG.md has no '## $TAG' section — add release notes for this version"
            exit 1
          fi
          {
            echo
            echo "---"
            echo
            echo "Install manually by downloading the assets below into \`<vault>/.obsidian/plugins/inkbound/\`, then enable **Inkbound** in Settings → Community plugins."
          } >> "$notes_file"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists — updating notes and re-uploading assets"
            gh release edit "$TAG" --title "Inkbound $TAG" --notes-file "$notes_file"
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" --title "Inkbound $TAG" --notes-file "$notes_file" "${assets[@]}"
          fi
          # A release left in draft state is invisible to Obsidian's installer
          # and to unauthenticated API clients, so force it published every
          # time. This also rescues a draft left behind by an earlier failed
          # release attempt, which is otherwise easy to miss.
          gh release edit "$TAG" --draft=false --latest

          gh release view "$TAG" --json tagName,isDraft,assets \
            --jq '"published=\(.isDraft | not) tag=\(.tagName) assets=\(.assets | map(.name) | join(", "))"'
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "false" \
            || { echo "::error::release $TAG is still a draft"; exit 1; }
