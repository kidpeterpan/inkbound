name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Pinned, not "latest": epubcheck's own rules change between releases, so
      # an unpinned version turns an upstream release into a red build on a PR
      # that changed nothing. Bump it deliberately, and expect to fix whatever
      # the new version newly objects to in the same commit.
      EPUBCHECK_VERSION: "5.3.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc --noEmit
      - run: npm run test:coverage
      - run: npm run build
      # 008-mobile-support: must follow `build` — it inspects the built bundle
      # and loads it in a mobile-like runtime. Guards the load-time invariant
      # that makes the plugin work on Obsidian mobile at all.
      - run: npm run check-mobile-safe
      # Must also follow `build` — scans the built bundle for the
      # dynamic-code-execution text Obsidian's plugin review greps for
      # (eval/new Function), including false positives that ship inside
      # bundled vendor code. See scripts/check-review-safe.mjs.
      - run: npm run check-review-safe
      # Must also follow `build` — loads the SHIPPED main.js and runs a full
      # export through it against tests/fixtures/smoke-vault. The only gate that
      # executes the artifact's export pipeline rather than src/ or a rebuild.
      - run: npm run check-export-works
        env:
          # Keeps a copy of the book the shipped bundle just exported — the
          # script's own temp dir is gone by the time the next step runs.
          INKBOUND_KEEP_EPUB: ${{ runner.temp }}/exported.epub

      # EPUB 3 spec validation. This is the only gate whose pass/fail criteria
      # come from OUTSIDE this repo: every gate above asserts what this code
      # believes a book should be, and agrees with itself by construction.
      # epubcheck is what a reader's parser would say. It runs over BOTH the
      # hand-built sample (edge cases: nested nav Parts, Thai fragment ids,
      # MathJax SVG, embedded fonts) and the book the shipped main.js just
      # exported from the fixture vault.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install epubcheck
        run: |
          set -euo pipefail
          curl -sSL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/epubcheck.zip" \
            "https://github.com/w3c/epubcheck/releases/download/v$EPUBCHECK_VERSION/epubcheck-$EPUBCHECK_VERSION.zip"
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP"
          # The jar resolves its dependencies from a sibling lib/ through its
          # manifest classpath, so it is used where it was unpacked.
          echo "EPUBCHECK_JAR=$RUNNER_TEMP/epubcheck-$EPUBCHECK_VERSION/epubcheck.jar" >> "$GITHUB_ENV"
      - run: npm run epubcheck -- "$RUNNER_TEMP/exported.epub"

      # A spec violation is far easier to diagnose with the book in hand than
      # from a log line naming a file that no longer exists.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: exported-epub
          path: ${{ runner.temp }}/exported.epub
          if-no-files-found: ignore

      - run: npm run version:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
