<!--
  REAL Obsidian footnote markup, second capture — contexts the first capture lacked.
  Ground truth for 011-footnote-semantics FR-003 / FR-030.

  Captured 2026-09-29 from a live Obsidian 1.13.7 (macOS), same method as
  footnotes-real.html: `obsidian vault=pan_vault eval` driving dataview's
  api.renderValue(markdown, detachedDiv, ...), i.e. the real MarkdownRenderer. Each
  case below was a SEPARATE render (so each has its own random docId). The
  <div data-capture="..."> wrappers are added by this file's author to delimit cases;
  everything inside a wrapper, minus dataview's outer <span>, is Obsidian's output.

  Source markdown per case (Python repr):
    [table]  '| a | b |\n|---|---|\n| cell[^t] | x |\n\n[^t]: Table note.'
    [callout]  '> [!note] Title\n> body with ref[^c]\n\n[^c]: Callout note.'
    [blockquote]  '> quote with ref[^q]\n\n[^q]: Quote note.'
    [duplicateDefinition]  'Ref[^d] here.\n\n[^d]: first definition.\n\n[^d]: second definition.'
    [sameLabelTwoRefsAndUnusedAfter]  'One[^s] two[^s].\n\n[^s]: Shared note.\n[^z]: Unused.'

  What it proves (see specs/011-footnote-semantics/research.md):
   - markers inside a table cell, a callout and a blockquote are ordinary
     sup.footnote-ref elements in place; the notes section is a TOP-LEVEL sibling
     that follows the table / callout / blockquote, never nested inside it;
   - with two definitions for one label, Obsidian keeps the LAST ("second definition")
     and renders ONE note;
   - two references to one note read [1] and [1-1], with two identical back-links.
-->
